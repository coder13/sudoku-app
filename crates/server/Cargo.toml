[package]
name = "sudoku-app-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
sudoku-app-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

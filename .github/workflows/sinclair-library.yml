name: Generate Sinclair library

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Optional edition seed. Leave blank to use this run's ID.
        type: string
        required: false

permissions:
  contents: read

env:
  SINCLAIR_SEED: ${{ inputs.seed || github.run_id }}
  RUSTUP_TOOLCHAIN: stable

jobs:
  candidates:
    name: Generate ${{ matrix.variant }} candidates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [classic, killer-cages, windoku, diagonal, jigsaw, anti-knight, thermometer, arrow, kropki]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cargo build --release --locked -p sudoku-app-engine --features wasm-api --example sinclair
      - name: Search every level of this variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: node --experimental-strip-types scripts/sinclair/catalog-pool.mts "$RUNNER_TEMP/pool" 2 135 "$VARIANT/"
      - name: Improve Classic starting layouts
        if: matrix.variant == 'classic'
        run: node --experimental-strip-types scripts/sinclair/catalog-polish.mts "$RUNNER_TEMP/pool" 2
      - name: Find empty-grid Killer puzzles
        if: matrix.variant == 'killer-cages'
        run: |
          node --experimental-strip-types scripts/sinclair/catalog-cages.mts "$RUNNER_TEMP/pool" 2 135 easy,medium
          node --experimental-strip-types scripts/sinclair/catalog-cage-trades.mts "$RUNNER_TEMP/pool" 2 140
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidates-${{ matrix.variant }}
          path: ${{ runner.temp }}/pool/*.jsonl
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  edition:
    name: Select and verify 6,600 puzzles
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/candidates
      - name: Install the verification tools
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y z3
          npm ci
          cargo build --release --locked -p sudoku-app-engine --features wasm-api --example sinclair
      - name: Select a complete edition
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/pool"
          for name in candidates classic-layouts cages cage-trades cage-conversions; do
            parts=("$RUNNER_TEMP"/candidates/*/"$name.jsonl")
            if (( ${#parts[@]} )); then
              cat "${parts[@]}" > "$RUNNER_TEMP/pool/$name.jsonl"
            fi
          done
          node --experimental-strip-types scripts/sinclair/publish-catalog.mts "$RUNNER_TEMP/pool"
      - name: Verify solutions, layouts, grades and publishable files
        run: |
          npm run build
          report=docs/research/sinclair/catalog
          python3 scripts/sinclair/audit-catalog.py data/sinclair "$RUNNER_TEMP/solutions.txt" --jobs 2 --report "$report/solutions.json"
          python3 scripts/sinclair/audit-variety.py data/sinclair "$report/variety.json"
          node --experimental-strip-types scripts/sinclair/audit-grades.mts data/sinclair "$RUNNER_TEMP/grades.json"
          node --experimental-strip-types scripts/sinclair/audit-deploy.mjs "$RUNNER_TEMP/grades.json"
          jq -n --arg seed "$SINCLAIR_SEED" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{seed: $seed, commit: $commit, run: $run}' > "$report/generation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sinclair-library-${{ github.run_id }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          path: |
            data/sinclair/
            docs/research/sinclair/catalog/selection.jsonl.gz
            docs/research/sinclair/catalog/solutions.json
            docs/research/sinclair/catalog/variety.json
            docs/research/sinclair/catalog/grades.json
            docs/research/sinclair/catalog/deploy.json
            docs/research/sinclair/catalog/generation.json

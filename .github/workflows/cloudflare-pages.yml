name: Cloudflare Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number for a preview. Leave blank to redeploy main.'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number && format('check-{0}', github.event.pull_request.number) || inputs.pull_request && format('preview-{0}', inputs.pull_request) || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Build and check Sudoku' || 'Build and deploy Sudoku' }}
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES_BRANCH: main
    steps:
      - name: Resolve the pull request for this preview
        id: preview
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter a positive pull request number."
            exit 1
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" \
            'select(.state == "open" and .head.repo.full_name == $repo) | .head.sha' <<< "$pr"); then
            echo "::error::Choose an open pull request from this repository."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PAGES_BRANCH=pr-$PR_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.preview.outputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build:cloudflare
        env:
          RUSTUP_TOOLCHAIN: stable
          VITE_EXPERIMENTAL_MODE: ${{ (github.event_name == 'pull_request' || steps.preview.outputs.sha != '') && 'true' || 'false' }}

      - name: Check board, startup, resize, and solver lifecycles
        if: github.event_name == 'pull_request' || steps.preview.outputs.sha != ''
        run: |
          npm run check
          npm test
          npm --prefix tools/react-board-performance ci
          npm --prefix tools/react-board-performance run check
          npm exec --prefix tools/react-board-performance -- playwright install --with-deps chromium
          npm --prefix tools/react-board-performance run benchmark -- --samples 4 --rounds 1 --warmup 2 --profile desktop --output results/ci.json
          node tools/react-board-performance/scripts/motion.mjs --regression-only --output results/motion-ci.json
          node scripts/check-mobile-resize.mjs --regression-only --output tools/react-board-performance/results/resize-ci.json
          node --experimental-strip-types scripts/check-worktable-lifecycle.mjs --output tools/react-board-performance/results/lifecycle-ci.json
          node --experimental-sqlite --experimental-strip-types scripts/check-startup-loading.mjs --output tools/react-board-performance/results/startup-ci.json

      - name: Deploy to Cloudflare Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name klyn-sudoku --branch ${{ env.PAGES_BRANCH }}

      - name: Report and check deployment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          PREVIEW_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          if [[ "$PAGES_BRANCH" == main ]]; then
            site_url=https://sudoku.klyn.gay
          else
            site_url="${PREVIEW_URL:-$DEPLOYMENT_URL}"
          fi

          printf '[%s](%s) · [This deployment](%s)\n' "$PAGES_BRANCH" "$site_url" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

          check_health() {
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              --max-time 20 "$1/api/v1/health" | jq -e '.ok == true'
          }

          check_health "$DEPLOYMENT_URL"
          if [[ "$site_url" != "$DEPLOYMENT_URL" ]]; then
            check_health "$site_url"
          fi

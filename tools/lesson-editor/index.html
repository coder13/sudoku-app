<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku lesson editor</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="./editor.css">
  <script type="module" src="./editor.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand">Sudoku lesson editor</div>
    <div class="page-picker"><label for="article">Article</label><select id="article" disabled></select></div>
    <div class="toolbar-actions">
      <div class="mode" role="group" aria-label="Editor mode">
        <button id="edit" type="button" aria-pressed="true">Edit</button>
        <button id="view" type="button" aria-pressed="false">Preview</button>
      </div>
      <a id="open" href="/learn" target="_blank" rel="noopener">Open in app ↗</a>
      <button id="save" type="button" disabled>Save to file</button>
    </div>
  </header>
  <div class="notice">
    <span id="instruction">Click any highlighted text to edit it.</span>
    <span id="status" role="status">Loading articles…</span>
  </div>
  <main class="workspace">
    <aside id="inspector" aria-label="Article controls"></aside>
    <section class="canvas" aria-label="Article canvas">
      <iframe id="canvas" title="Sudoku article preview"></iframe>
    </section>
  </main>
</body>
</html>
